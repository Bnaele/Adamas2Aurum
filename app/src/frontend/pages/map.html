<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>A2A — Interactive Campus Map</title>

		<link href="/vendor/maplibre-gl.css" rel="stylesheet" />
		<script src="/vendor/maplibre-gl.js" defer></script>

		<link rel="stylesheet" href="../css/map.css" />
		<link rel="stylesheet" href="../css/style.css" />

		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				overflow: hidden;
			}

			.app-header {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				height: 52px;
				background: var(--surface);
				border-bottom: 1px solid var(--border);
				display: flex;
				align-items: center;
				padding: 0 1.25rem;
				gap: 1rem;
				z-index: 1000;
			}
			.app-header h1 {
				font-family: var(--font-display);
				font-size: 1.1rem;
				font-weight: 800;
				color: var(--gold);
				margin: 0;
			}
			.header-subtitle {
				font-size: 0.75rem;
				color: var(--text-muted);
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}

			.map-container {
				position: fixed;
				top: 52px;
				bottom: 0;
				left: 0;
				right: 0;
			}
			#map {
				width: 100%;
				height: 100%;
				position: relative;
			}

			/* Distance-fog fallback (MapLibre v3 has no style-spec fog):
			 * radial fade to the ground color at the view edges. */
			.map-fog {
				position: absolute;
				inset: 0;
				pointer-events: none;
				/* Directional chase-cam fog: strong fade toward the
				 * top/horizon (far ahead), clear near the bottom (player),
				 * plus a softer radial squeeze on the sides. */
				background:
					linear-gradient(
						to bottom,
						rgba(235, 248, 252, 0.95) 0%,
						rgba(235, 248, 252, 0.4) 24%,
						transparent 46%
					),
					radial-gradient(
						ellipse at center,
						transparent 62%,
						rgba(215, 240, 228, 0.6) 100%
					);
				z-index: 3; /* above map canvas, below HUD panels */
			}
			body.night .map-fog {
				background:
					linear-gradient(
						to bottom,
						rgba(4, 10, 20, 0.95) 0%,
						rgba(4, 10, 20, 0.45) 24%,
						transparent 46%
					),
					radial-gradient(
						ellipse at center,
						transparent 62%,
						rgba(4, 10, 20, 0.65) 100%
					);
			}
			body.night .pogo-clouds {
				opacity: 0.3;
				filter: brightness(0.65);
			}

			/* ---- Drifting PoGO clouds (decorative, non-interactive) ---- */
			.pogo-clouds {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 22%;
				z-index: 4;
				pointer-events: none;
				overflow: hidden;
			}
			.cloud {
				position: absolute;
				background: rgba(255, 255, 255, 0.92);
				border-radius: 999px;
				opacity: 0.9;
				animation: drift linear infinite;
			}
			.cloud::before,
			.cloud::after {
				content: '';
				position: absolute;
				background: inherit;
				border-radius: 50%;
			}
			.cloud::before {
				width: 45%;
				height: 160%;
				left: 12%;
				top: -70%;
			}
			.cloud::after {
				width: 32%;
				height: 110%;
				right: 14%;
				top: -40%;
			}
			.c1 {
				top: 5%;
				width: 190px;
				height: 56px;
				animation-duration: 110s;
			}
			.c2 {
				top: 14%;
				width: 130px;
				height: 40px;
				animation-duration: 80s;
				animation-delay: -30s;
			}
			.c3 {
				top: 9%;
				width: 240px;
				height: 64px;
				animation-duration: 140s;
				animation-delay: -70s;
			}
			.c4 {
				top: 20%;
				width: 110px;
				height: 34px;
				animation-duration: 65s;
				animation-delay: -15s;
			}
			@keyframes drift {
				from {
					transform: translateX(-35vw);
				}
				to {
					transform: translateX(112vw);
				}
			}

			@keyframes panel-pop {
				from {
					transform: scale(0.92);
					opacity: 0;
				}
				to {
					transform: scale(1);
					opacity: 1;
				}
			}
			#hud,
			#legend,
			#tilt-controls {
				animation: panel-pop 0.35s ease backwards;
			}
			#legend {
				animation-delay: 0.06s;
			}
			#tilt-controls {
				animation-delay: 0.12s;
			}
			@media (prefers-reduced-motion: reduce) {
				#hud,
				#legend,
				#tilt-controls,
				.cloud {
					animation: none !important;
				}
			}
			#hud {
				position: absolute;
				top: 16px;
				left: 16px;
				z-index: 5;
				background: #ffffff;
				border: 3px solid #2f9df0;
				border-radius: 14px;
				padding: 10px 16px;
				box-shadow: 0 4px 0 rgba(47, 157, 240, 0.35);
				max-width: 270px;
			}
			#hud h1 {
				margin: 0 0 4px 0;
				font-size: 15px;
				color: #2f9df0;
			}
			#hud p {
				margin: 0;
				font-size: 12px;
				color: #5b6b82;
				line-height: 1.4;
			}

			#legend {
				position: absolute;
				bottom: 16px;
				left: 16px;
				z-index: 5;
				background: #ffffff;
				border: 3px solid #2f9df0;
				border-radius: 14px;
				padding: 10px 14px;
				box-shadow: 0 4px 0 rgba(47, 157, 240, 0.35);
				font-size: 11px;
				color: #33475f;
			}
			#legend div {
				display: flex;
				align-items: center;
				gap: 6px;
				margin: 3px 0;
			}
			#legend span.swatch {
				width: 12px;
				height: 12px;
				border-radius: 3px;
				display: inline-block;
				border: 1.5px solid #c4cfde;
			}

			#tilt-controls {
				position: absolute;
				top: 16px;
				right: 16px;
				z-index: 5;
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			#tilt-controls button {
				background: #ffffff;
				border: 2px solid #2f9df0;
				border-radius: 10px;
				box-shadow: 0 3px 0 rgba(47, 157, 240, 0.35);
				padding: 8px 10px;
				font-size: 12px;
				font-weight: 600;
				color: #2f9df0;
				cursor: pointer;
			}
			#tilt-controls button:active {
				box-shadow: 0 1px 0 rgba(47, 157, 240, 0.35);
				transform: translateY(2px);
			}

			#building-popup {
				font-size: 12px;
				color: #33475f;
				font-weight: 600;
			}
			.maplibregl-ctrl-attrib {
				font-size: 10px;
			}
			.maplibregl-ctrl-attrib a {
				color: #54637a !important;
			}

			.pokestop-marker {
				width: 26px;
				height: 26px;
				border-radius: 50%;
				background: radial-gradient(
					circle at 35% 30%,
					#ffc46b,
					#ef7d1a 70%
				);
				border: 3px solid #fff;
				box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
				display: flex;
				align-items: center;
				justify-content: center;
				color: #fff;
				font-size: 12px;
				cursor: pointer;
			}

			.event-popup h3 {
				margin: 0 0 4px;
				font-size: 0.95rem;
				font-weight: 600;
			}
			.event-popup p {
				margin: 0 0 6px;
				font-size: 0.82rem;
				color: #555;
			}
			.location-tag {
				font-size: 0.72rem;
				color: #888;
			}
			.popup-actions {
				margin-top: 8px;
			}
			.maplibregl-ctrl-attrib {
				font-size: 10px;
			}
		</style>
	</head>
	<body>
		<header class="app-header">
			<h1>🏛️ Adamas to Aurum</h1>
			<span class="header-subtitle">
				Interactive Campus Exploration
			</span>
		</header>

		<main class="map-container">
			<div id="map">
				<div class="map-fog" aria-hidden="true"></div>
				<div class="pogo-clouds" aria-hidden="true">
					<div class="cloud c1"></div>
					<div class="cloud c2"></div>
					<div class="cloud c3"></div>
					<div class="cloud c4"></div>
				</div>
				<div id="hud">
					<h1>Explore — world view</h1>
					<p>
						Browse the whole world. Event
						stops live at Wits — open the
						main map for GPS play with
						challenge stops.
					</p>
				</div>

				<div id="legend">
					<div>
						<span
							class="swatch"
							style="
								background: #6e7683;
							"
						></span>
						Roads
					</div>
					<div>
						<span
							class="swatch"
							style="
								background: #69b795;
							"
						></span>
						Buildings
					</div>
					<div>
						<span
							class="swatch"
							style="
								background: #66b78e;
							"
						></span>
						Parks
					</div>
					<div>
						<span
							class="swatch"
							style="
								background: #8acde8;
							"
						></span>
						Water
					</div>
				</div>

				<div id="tilt-controls">
					<button id="btn-tilt">Tilt view</button>
					<button id="btn-reset">
						Reset camera
					</button>
				</div>
			</div>
		</main>

		<script type="module">
			import {
				createCampusStyle,
				CAMPUS_CAMERA,
				CAMPUS_MIN_ZOOM,
				CAMPUS_MAX_ZOOM,
				CAMPUS_MIN_PITCH,
				CAMPUS_MAX_PITCH,
				addGroundTexture,
				startDayNightCycle,
			} from '../js/campus-style.js'
			import { API_BASE } from '../js/constants.js'

			const map = new maplibregl.Map({
				container: 'map',
				style: createCampusStyle(),
				center: CAMPUS_CAMERA.center,
				zoom: CAMPUS_CAMERA.zoom,
				pitch: CAMPUS_CAMERA.pitch,
				bearing: CAMPUS_CAMERA.bearing,
				minZoom: CAMPUS_MIN_ZOOM,
				maxZoom: CAMPUS_MAX_ZOOM,
				// Same as main map: v3 clamps pitch to 60 unless told otherwise.
				minPitch: CAMPUS_MIN_PITCH,
				maxPitch: CAMPUS_MAX_PITCH,
				attributionControl: { compact: true },
			})

			map.addControl(
				new maplibregl.NavigationControl({
					visualizePitch: true,
				}),
				'bottom-right'
			)

			let tilted = true
			document.getElementById('btn-tilt').addEventListener(
				'click',
				() => {
					tilted = !tilted
					map.easeTo({
						pitch: tilted ? 72 : 60,
						duration: 600,
					})
				}
			)
			document.getElementById('btn-reset').addEventListener(
				'click',
				() => {
					tilted = true
					map.easeTo({
						...CAMPUS_CAMERA,
						duration: 700,
					})
				}
			)

			// Overlay live event markers from the backend API (if available).
			// Stops are always visible and tappable; the main page gates
			// challenge attempts to on-campus players.
			map.on('load', async () => {
				addGroundTexture(map, 'water')
				startDayNightCycle(map)
				try {
					const res = await fetch(
						`${API_BASE}/api/events`
					)
					if (!res.ok) return
					const events = await res.json()
					if (!Array.isArray(events)) return
					for (const event of events) {
						const lng = parseFloat(
							event.longitude
						)
						const lat = parseFloat(
							event.latitude
						)
						if (
							Number.isNaN(lng) ||
							Number.isNaN(lat)
						)
							continue
						const el =
							document.createElement(
								'div'
							)
						el.className = 'pokestop-marker'
						el.textContent = '⚡'
						const popup =
							new maplibregl.Popup({
								offset: 18,
							}).setHTML(
								`<div class="event-popup"><h3>${event.title ?? 'Event'}</h3>` +
									`<p>${event.description ?? ''}</p>` +
									`<span class="location-tag">${event.campus ?? ''}</span></div>`
							)
						new maplibregl.Marker({
							element: el,
						})
							.setLngLat([lng, lat])
							.setPopup(popup)
							.addTo(map)
					}
				} catch {
					// Offline backend: campus still renders fully.
				}
			})
		</script>
	</body>
</html>
