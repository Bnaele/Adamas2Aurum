name: Coverage Run

on:
        pull_request:
                branches: [main, dev]

jobs:
        coverage-run:
                runs-on: ubuntu-latest
                steps:
                        - name: Checkout Code
                          uses: actions/checkout@v4
                          with:
                                  fetch-depth: 0
                                  token: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}

                        - name: Setup Node.js 20
                          uses: actions/setup-node@v4
                          with:
                                  node-version: '20'
                                  cache: 'npm'

                        - name: Install Dependencies
                          run: npm ci

                        - name: Install Backend Dependencies
                          run: npm ci --prefix app/src/backend

                        - name: Run Tests with Coverage
                          id: tests
                          continue-on-error: true
                          run: npm run test:ci

                        - name: Generate Coverage Badges
                          if: always()
                          run: |
                                  mkdir -p badges
                                  npm run badges || npx jest-coverage-badges --input coverage/coverage-summary.json --output badges || true
                                  ls -la badges/ || true

                        - name: Generate Test Badge
                          if: always()
                          run: |
                                  mkdir -p badges
                                  if [ "${{ steps.tests.outcome }}" = "success" ]; then
                                    curl -s "https://img.shields.io/badge/tests-passing-brightgreen" -o badges/badge-tests.svg
                                  else
                                    curl -s "https://img.shields.io/badge/tests-failing-red" -o badges/badge-tests.svg
                                  fi
                                  ls -la badges/badge-tests.svg || echo "badge generation failed"

                        - name: Commit and Push Badges
                          if: always()
                          run: |
                                  git config user.name "gitea-actions"
                                  git config user.email "gitea-actions@local"
                                  git add badges/ || true
                                  if git diff --staged --quiet; then
                                    echo "No badge changes to commit"
                                  else
                                    git commit -m "chore: update coverage badges [skip ci]"
                                    git push || echo "push failed (maybe PR from fork or no permission)"
                                  fi

                        - name: Upload Coverage Report
                          if: always()
                          uses: actions/upload-artifact@v4
                          with:
                                  name: coverage-report
                                  path: coverage/lcov-report/
                                  retention-days: 14
                                  if-no-files-found: warn

                        - name: Check Tests Outcome
                          if: always()
                          run: |
                                  if [ "${{ steps.tests.outcome }}" = "failure" ]; then
                                    echo "Tests or coverage thresholds failed — failing pipeline"
                                    exit 1
                                  fi
                                  echo "Tests passed and coverage thresholds met"
